<text x="880" y="145" text-anchor="middle" font-size="20" fill="#18364a">HỆ THỐNG AQUACARE</text>
<g stroke="#334155" stroke-width="2.4" fill="white"><circle cx="140" cy="515" r="13"/><path d="M140 528v43 m-25,-29 h50 m-25,29 l-22,29 m22,-29 l22,29" fill="none"/></g>
<text x="140" y="624" text-anchor="middle" font-size="20" fill="#18364a">Người truy cập web</text>
<path class="edge" d="M165 545 L360 232.5"/>
<ellipse cx="570" cy="232.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="227" text-anchor="middle" font-size="22" fill="#18364a">Xem giới thiệu, thiết bị</text>
<text x="570" y="252" text-anchor="middle" font-size="22" fill="#18364a">và gói cước</text>
<path class="edge" d="M165 545 L360 357.5"/>
<ellipse cx="570" cy="357.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="364.5" text-anchor="middle" font-size="22" fill="#18364a">Quản lý giỏ hàng</text>
<text x="1140" y="364.5" text-anchor="middle" font-size="17" fill="#18364a">Thêm sản phẩm, đổi số lượng, xóa sản phẩm.</text>
<path class="edge" d="M165 545 L360 482.5"/>
<ellipse cx="570" cy="482.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="489.5" text-anchor="middle" font-size="22" fill="#18364a">Đặt hàng</text>
<ellipse cx="1160" cy="482.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="1160" y="477" text-anchor="middle" font-size="22" fill="#18364a">Cung cấp thông tin nhận hàng</text>
<text x="1160" y="502" text-anchor="middle" font-size="22" fill="#18364a">và chọn COD / chuyển khoản</text>
