<text x="880" y="45" text-anchor="middle" font-size="30" fill="#18364a">AQUACARE · Tra cứu, mua hàng và liên hệ</text>
<text x="880" y="82" text-anchor="middle" font-size="19" fill="#18364a">Luồng mua hàng và liên hệ được triển khai trên website / landing page.</text>
