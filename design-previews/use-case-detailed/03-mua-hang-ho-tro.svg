<ellipse cx="570" cy="607.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="614.5" text-anchor="middle" font-size="22" fill="#18364a">Gửi yêu cầu hỗ trợ</text>
<path class="edge" d="M165 545 L360 732.5"/>
<ellipse cx="570" cy="732.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="739.5" text-anchor="middle" font-size="22" fill="#18364a">Tra cứu phản hồi hỗ trợ</text>
<text x="1140" y="739.5" text-anchor="middle" font-size="17" fill="#18364a">Theo tài khoản; khách chưa đăng nhập tra cứu theo email.</text>
<path class="edge" d="M165 545 L360 857.5"/>
<ellipse cx="570" cy="857.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="864.5" text-anchor="middle" font-size="22" fill="#18364a">Tải APK từ landing page</text>
<g stroke="#334155" stroke-width="2.4" fill="white"><circle cx="140" cy="992.5" r="13"/><path d="M140 1005.5v43 m-25,-29 h50 m-25,29 l-22,29 m22,-29 l22,29" fill="none"/></g>
<text x="140" y="1101.5" text-anchor="middle" font-size="20" fill="#18364a">Khách hàng đăng nhập</text>
<path class="edge" d="M165 1022.5 L360 1022.5"/>
<ellipse cx="570" cy="1022.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="1017" text-anchor="middle" font-size="22" fill="#18364a">Xem lịch sử, chi tiết</text>
<text x="570" y="1042" text-anchor="middle" font-size="22" fill="#18364a">và trạng thái đơn hàng</text>
<text x="330" y="1170" text-anchor="start" font-size="21" fill="#18364a">Ghi chú phạm vi và điều kiện</text>
<text x="330" y="1202" text-anchor="start" font-size="18" fill="#18364a">• Người truy cập web có thể là khách chưa đăng nhập hoặc người đã có tài khoản.</text>
<text x="330" y="1230" text-anchor="start" font-size="18" fill="#18364a">• CartPage lưu user_id = null khi đặt hàng không có phiên đăng nhập.</text>
<text x="330" y="1258" text-anchor="start" font-size="18" fill="#18364a">• Chưa mô hình hóa cổng thanh toán / đối soát tự động: QR chuyển khoản hiện dùng dữ liệu mẫu.</text>
<text x="330" y="1286" text-anchor="start" font-size="18" fill="#18364a">• Xem gói cước không đồng nghĩa đã có luồng mua / gia hạn gói tự động.</text>
</svg>