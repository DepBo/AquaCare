<text x="880" y="760" text-anchor="middle" font-size="21" fill="#18364a">Actor ngoài hệ thống: Khách truy cập · Thiết bị IoT · Google OAuth · Dịch vụ email · Firebase FCM</text>
<text x="880" y="810" text-anchor="middle" font-size="20" fill="#18364a">Nhân viên là vai trò khái quát: chỉ kế thừa chức năng chung, không kế thừa mọi quyền nghiệp vụ.</text>
<text x="880" y="850" text-anchor="middle" font-size="20" fill="#18364a">Vai trò legacy staff có quyền tổng hợp; bốn vai trò staff_* được giới hạn theo nhóm công việc.</text>
<text x="880" y="890" text-anchor="middle" font-size="20" fill="#18364a">Admin không kế thừa khách hàng hoặc nhân viên: các trang được điều hướng theo vai trò riêng.</text>
