<text x="570" y="1457" text-anchor="middle" font-size="22" fill="#18364a">Cập nhật hoàn tất</text>
<text x="570" y="1482" text-anchor="middle" font-size="22" fill="#18364a">công việc bảo trì</text>
<text x="330" y="1610" text-anchor="start" font-size="21" fill="#18364a">Ghi chú phạm vi và điều kiện</text>
<text x="330" y="1642" text-anchor="start" font-size="18" fill="#18364a">• Kho kiểm tra MAC tồn tại, không trùng, chưa bán / gắn bể và đúng phiên bản sản phẩm.</text>
<text x="330" y="1670" text-anchor="start" font-size="18" fill="#18364a">• Hoàn tất đóng gói lưu MAC, đánh dấu thiết bị đã xuất và tạo việc giao / lắp đặt.</text>
<text x="330" y="1698" text-anchor="start" font-size="18" fill="#18364a">• Giao hàng và bảo trì nhận việc bằng cập nhật trạng thái, gán assigned_to cho người nhận.</text>
<text x="330" y="1726" text-anchor="start" font-size="18" fill="#18364a">• Vai trò legacy staff có các tab tổng hợp; bốn vai trò staff_* chỉ có tab được cấp.</text>
<text x="330" y="1754" text-anchor="start" font-size="18" fill="#18364a">• Không giả định nhân viên kho / hỗ trợ được dùng bảng nhận việc của giao hàng và bảo trì.</text>
