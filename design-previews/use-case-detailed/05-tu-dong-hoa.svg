<text x="900" y="1345" text-anchor="middle" font-size="23">Điều kiện và phạm vi</text>
<text x="900" y="1380" text-anchor="middle" font-size="19">Dữ liệu hợp lệ từ thiết bị đã đăng ký, đang hoạt động mới được tiếp nhận và đánh giá.</text>
<text x="900" y="1410" text-anchor="middle" font-size="19">Lưu cảnh báo độc lập với việc gửi thông báo; email, web và app chỉ gửi theo cấu hình.</text>
<text x="900" y="1440" text-anchor="middle" font-size="19">Lệnh theo lịch: đến hạn, thiết bị hoạt động, trạng thái cần đổi. Timer là thành phần nội bộ.</text>
<text x="900" y="1470" text-anchor="middle" font-size="19">Nếu trạng thái đã đúng: worker chỉ đánh dấu lịch đã xử lý, không phát lệnh lại.</text>
<text x="900" y="1500" text-anchor="middle" font-size="18">Actor Thiết bị IoT được lặp vị trí để dễ đọc; vẫn là cùng một loại actor.</text>
