<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1379" viewBox="0 0 1760 1379"><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#475569" stroke-width="1.5"/></marker><marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="13" markerHeight="13" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="white" stroke="#475569" stroke-width="1.2"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif}.edge{stroke:#7b8b9f;stroke-width:1.6;fill:none}.rel{stroke:#475569;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}.gen{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#tri)}</style><rect width="100%" height="100%" fill="white"/>
<text x="880" y="45" text-anchor="middle" font-size="30" fill="#18364a">AQUACARE · Tài khoản và truy cập</text>
<text x="880" y="82" text-anchor="middle" font-size="19" fill="#18364a">Các vai trò dùng chung chức năng tài khoản; đăng ký công khai tạo tài khoản khách hàng.</text>
<rect x="295" y="115" width="1170" height="1095" rx="6" fill="#fcfefe" stroke="#64748b" stroke-width="2"/>
<text x="880" y="145" text-anchor="middle" font-size="20" fill="#18364a">HỆ THỐNG AQUACARE</text>
<g stroke="#334155" stroke-width="2.4" fill="white"><circle cx="140" cy="265" r="13"/><path d="M140 278v43 m-25,-29 h50 m-25,29 l-22,29 m22,-29 l22,29" fill="none"/></g>
<text x="140" y="374" text-anchor="middle" font-size="20" fill="#18364a">Khách truy cập</text>
<path class="edge" d="M165 295 L360 232.5"/>
<ellipse cx="570" cy="232.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="227" text-anchor="middle" font-size="22" fill="#18364a">Đăng ký tài khoản</text>
<text x="570" y="252" text-anchor="middle" font-size="22" fill="#18364a">khách hàng</text>
<path class="edge" d="M165 295 L360 357.5"/>
<ellipse cx="570" cy="357.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="364.5" text-anchor="middle" font-size="22" fill="#18364a">Đăng ký qua Google</text>
<text x="1140" y="364.5" text-anchor="middle" font-size="17" fill="#18364a">Luồng OAuth có thể tạo hồ sơ khi chưa có tài khoản.</text>
<g stroke="#334155" stroke-width="2.4" fill="white"><circle cx="140" cy="777.5" r="13"/><path d="M140 790.5v43 m-25,-29 h50 m-25,29 l-22,29 m22,-29 l22,29" fill="none"/></g>
<text x="140" y="886.5" text-anchor="middle" font-size="20" fill="#18364a">Người dùng hệ thống</text>
<path class="edge" d="M165 807.5 L360 620"/>
<ellipse cx="570" cy="620" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="627" text-anchor="middle" font-size="22" fill="#18364a">Đăng nhập</text>
<ellipse cx="1160" cy="540" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="1160" y="534.5" text-anchor="middle" font-size="22" fill="#18364a">Đăng nhập bằng</text>
<text x="1160" y="559.5" text-anchor="middle" font-size="22" fill="#18364a">email và mật khẩu</text>
<path class="gen" d="M950 540 L780 620"/>
<ellipse cx="1160" cy="700" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="1160" y="707" text-anchor="middle" font-size="22" fill="#18364a">Đăng nhập qua Google</text>
<path class="gen" d="M950 700 L780 620"/>
<g stroke="#334155" stroke-width="2.4" fill="white"><circle cx="1615" cy="670" r="13"/><path d="M1615 683v43 m-25,-29 h50 m-25,29 l-22,29 m22,-29 l22,29" fill="none"/></g>
<text x="1615" y="779" text-anchor="middle" font-size="20" fill="#18364a">Google OAuth</text>
<path class="edge" d="M1370 700 H1590"/>
<path class="edge" d="M165 807.5 L360 842.5"/>
<ellipse cx="570" cy="842.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="837" text-anchor="middle" font-size="22" fill="#18364a">Yêu cầu khôi phục</text>
<text x="570" y="862" text-anchor="middle" font-size="22" fill="#18364a">mật khẩu</text>
<ellipse cx="1160" cy="842.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="1160" y="837" text-anchor="middle" font-size="22" fill="#18364a">Gửi liên kết khôi phục</text>
<text x="1160" y="862" text-anchor="middle" font-size="22" fill="#18364a">qua email</text>
<path class="rel" d="M780 842.5 L950 842.5"/>
<text x="865" y="829.5" text-anchor="middle" font-size="17" fill="#18364a">&lt;&lt;include&gt;&gt;</text>
<path class="edge" d="M165 807.5 L360 967.5"/>
<ellipse cx="570" cy="967.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="974.5" text-anchor="middle" font-size="22" fill="#18364a">Đặt mật khẩu mới</text>
<text x="1140" y="974.5" text-anchor="middle" font-size="17" fill="#18364a">Điều kiện: có phiên / liên kết khôi phục hợp lệ.</text>
<path class="edge" d="M165 807.5 L360 1092.5"/>
<ellipse cx="570" cy="1092.5" rx="210" ry="43" stroke="#0f766e" stroke-width="2" fill="#f0fdfa"/>
<text x="570" y="1099.5" text-anchor="middle" font-size="22" fill="#18364a">Đăng xuất</text>
<text x="330" y="1240" text-anchor="start" font-size="21" fill="#18364a">Ghi chú phạm vi và điều kiện</text>
<text x="330" y="1272" text-anchor="start" font-size="18" fill="#18364a">• Mũi tên tam giác: cách đăng nhập cụ thể kế thừa use case Đăng nhập.</text>
<text x="330" y="1300" text-anchor="start" font-size="18" fill="#18364a">• Đăng nhập là điều kiện trước của nghiệp vụ được bảo vệ, không phải include của mọi thao tác.</text>
<text x="330" y="1328" text-anchor="start" font-size="18" fill="#18364a">• Yêu cầu khôi phục và đặt mật khẩu mới là hai lần tương tác; không nối include giữa chúng.</text>
</svg>